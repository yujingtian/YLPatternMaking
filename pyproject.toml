[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ylpattern"
version = "0.1.0"
description = "牛仔裤数字化打版系统：函数即绘制步骤，流程编排，先画后裁"
requires-python = ">=3.10"
dependencies = [
    'tomli>=2; python_version < "3.11"',  # 尺寸单 TOML 解析（3.11+ 用标准库 tomllib）
]

[project.optional-dependencies]
dxf = ["ezdxf>=1.1"]
dev = ["pytest>=7.4", "ezdxf>=1.1"]   # ezdxf：DXF 导出测试（exporters 懒加载，核心零依赖不变）
web = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.5",
       "httpx>=0.27"]  # webapp 后端（webapp/ 独立目录，核心零依赖不变；httpx 是 /agent 同源转发运行依赖）
agent = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.5",
            "python-multipart>=0.0.9"]  # agent 服务与全部大模型代码（agent/ 独立目录，不进 wheel；multipart 是 UploadFile 硬依赖）

[project.scripts]
ylpattern = "ylpattern.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # agent/ 是仓库根顶层包（不进 wheel），裸 pytest 也可见

# ============================================================
# 牛仔裤打版尺寸单（单位：cm）
# 用法：ylpattern draft --size 本文件 --svg out/sheet.svg
# ============================================================

[measurements]
waist      = 74    # 腰围（成品）
hip        = 100    # 臀围 = 净臀围 + 放松量（影响框架宽度：H前 = H/4 − Δ）
knee       = 54    # 膝围
hem        = 47    # 裤口（脚口围）
front_rise = 30    # 前浪（前裆长，腰顶沿前裆弯量至裆点；立裆线高度由臀围推导，不用本值）
back_rise  = 40    # 后浪（后立裆长，应大于前浪）
outseam    = 103   # 裤长（外侧缝长；腰围线高度 = 裤长）
thigh      = 62    # 大腿围

[options]
# 前后片臀围单侧调节量 Δ，0~2.0，见 前后片臀围推导.md §四：
#   标准女装 1.0 / 翘臀 1.2~1.5 / 男装 0.5~0.75 / 高弹 0.3~0.5 / 宽松 0~0.5
delta               = 1.5
front_crotch_adjust = 0.0         # 前小裆修正量（紧身牛仔裤取 -0.5 ~ -1.0）
back_crotch_adjust  = 0.0         # 后大裆修正量（坐姿伸展加深取正，常规 0）
front_intake_ratio  = 0.2         # 前中内收系数（内收量 = (H−W)/4 × 系数；低腰款可取 0.15）
front_intake_adjust = 0.0         # 前中内收修正量（在系数算式结果上再加减；高腰取正、低腰取负）
back_intake         = 2.5         # 后中内收比例模数 X（实际内收 = 实际臀腰高 × X/15；
                                  #   宽松 1.5~2.0 / 标准 2.5~3.0 / 紧身提臀 3.5~4.5，后中内收点推导.md §二）
back_rise_alpha     = 0.40        # 后浪大裆弯上控制柄系数（0.38~0.42，后浪绘制.md §3.1）
back_rise_beta      = 0.50        # 后浪大裆弯下控制柄系数（0.48~0.55；紧身提臀取 0.55，§3.1）

# 前片腰围长 L = W/4 − waist_balance + front_waist_dart（真实腰围线的长度约束）
waist_balance       = 1.5         # 前后片腰围调节量（前片减、后片加；平分取 0，常取 1.0~1.5）
front_waist_dart    = 3.0         # 前片省量/褶量 V前省（标准牛仔裤 0；西裤/褶裥款 1.5~3.0）
back_waist_dart     = 3.0         # 后片省量/约克转移量 V后省（后腰长 = W/4 + balance + 本值；
                                  #   约克步骤前取 0；Yoke 转移 2.5~4.0，腰围推导.md §五）

# 直裆深 = 臀围 × rise_ratio + rise_adjust（默认 H/4）
rise_ratio          = 0.25
rise_adjust         = 4.0
crotch_drop_adjust  = 0.0         # 后片落裆调节量 Δc（落裆量 = H/100 + Δc；
                                  #   高弹 -0.4~-0.3 / 标准直筒 0 / 宽松重磅 +0.2~+0.3，落裆推导.md §2.2）

# 膝围/脚口前后片调整量 δ（前减后加：前片宽 = 总/2 − δ，后片宽 = 总/2 + δ）
# 标准无弹 1.0（前后差 2cm）；高弹款 0.5~0.75，见 脚口膝围外缝点推导.md §五.1
knee_adjust         = 2.5
hem_adjust          = 2.5

# 裤中线自定义调节量 e（前后片分别独立录入，前后片裤中线推导.md §五）
# 常规 0；修身显瘦 -0.5~-0.8；粗腿体型 +0.5~+1.0；后片常规与前片一致，特体独立设定
front_crease_e      = 0.0         # 前片裤中线调节量
back_crease_e       = 0.0         # 后片裤中线调节量

# 弧线参数（前片弧线推导.md；均可不传，取默认值）
calf_arc_alpha      = 0.10        # 小腿段弧弓高系数（0.08~0.12；0 = 直筒直线）
inseam_arc_k1       = 0.20        # 内缝大腿段小裆弯度（0.15~0.25，越大越早往膝口收）
inseam_arc_ky       = 0.28        # 内缝大腿段弯曲纵向位置（越大弯曲点越靠下）
inseam_arc_k2       = 0.35        # 内缝大腿段膝口切线柄长系数（越大衔接越顺直）
outseam_arc_dx      = 0.15        # 外缝大腿段大转子外凸量（0.1~0.2；顺直 0）
outseam_arc_m2      = 0.40        # 外缝大腿段膝口切线柄长系数
front_hem_arc_sag   = 0.0         # 前片脚口弧高（0 = 直线；正值向下凸，常取 0.3~0.8）
back_hem_arc_sag    = 0.0         # 后片脚口弧高（口径同前片，前后片独立录入）

# 腰头类型：straight = 直腰头（打版时扣除腰头宽）
#           curved   = 弯腰头（与前片一体绘制再裁出）
waistband_type      = "straight"
waistband_width     = 4.0         # 腰头宽（直腰头打版时从裤长中扣除；弯腰头忽略）
side_rise           = 1.0         # 侧缝腰头抬高量 h（0 = 腰围外缝顶点压腰围基础线，常取 0~1.5）
front_waist_curve_sag = 0.4     # 前片腰围线弧额外下凹量（贴合腰腹取 0.3~0.5，前腰头绘制推导.md §3）
back_waist_curve_sag  = 0.4     # 后片腰头线弧额外下凹量（贴合腰背背弓取 0.3~0.5，后腰头绘制推导.md §二）
                                #   （0 = 无额外下凹，但 90° 正交平顺段的弯曲仍在，非直线）

fit                 = "regular"   # 版型：skinny 紧身 / slim 修身 / regular 标准 / loose 宽松
seam_allowance      = 1.0         # 默认缝份宽度
piece_gap           = 10.0        # 前后片排版间距（后片整体置于前片右侧，分开不重叠）

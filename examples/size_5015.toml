# ============================================================
# 牛仔裤打版尺寸单（单位：cm）—— 5015#五代款正常脚边 宽脚直筒
# 来源：out/5015#五代款正常脚边，加大半个码W15%-L8%.dxf 反推
#   （SAMPLE SIZE: S，加大半个码后的基码；净样已含缩水放大，
#     横向 ×0.85 / 纵向 ×0.92 还原成品；缝份 12.7mm=½"）
# 用法：python -m ylpattern.cli draft --size 本文件 --svg out/5015_sheet.svg
# ============================================================

[measurements]
waist      = 64.8    # 腰围：2×(前腰弧 67.9 + 袋口段 103.6 + 机头上口 209.6)×0.85。
                     #   袋口段 = 袋贴顶边 P1->B'（缝位拟合实测，见下袋贴注释）；
                     #   旧口径 128.9 用了袋贴顶边全长——其中 25.3mm 是越过 P1
                     #   搭在面板腰口上的重叠段，不进围长（重复计入了）
hip        = 95.3    # 臀围：臀围线（立裆上方那根辅助线）2×(前 254.8 + 后 305.7)×0.85
                     #   注意立裆处那根线是毗围线（前 292.9/后 386 净宽），勿当臀围量
knee       = 51.0    # 膝围（单腿=前+后）：中裆线(前 265.7 + 后 333.2)×0.85
hem        = 50.0    # 裤口（单腿）：(前 260.5 + 后 327.7)×0.85
front_rise = 30.0    # 前浪：前浪弧 281.7×0.92 + 腰头 4
back_rise  = 37.8    # 后浪：(后浪 30.5 + 机头深 6.3)×0.92 + 腰头 4
outseam    = 99.5    # 裤长（腰线高度，弯腰头不扣）：净样全高 1036.5×0.92 + 腰头 4 ≈ 99.4
                     #   外侧缝弧实测约 105.7，宽脚斜丝拉长所致
# 毗围（单腿，立裆处那根线）：(前 292.9 + 后 386.1)×0.85 —— thigh_limit 开闭环自动收敛
thigh      = 57.7

[options]
thigh_limit          = true    # 毗围闭环（目标 thigh=57.7）

# 前后片调节量：宽脚"后包前"（后片各层比前片宽 4~8cm）
delta               = 2.2     # 前片 = H/4 − 2.2（DXF 臀围线拆分：前 21.66 / 后 25.98）
front_intake_adjust = 1
knee_adjust         = 2.9     # 膝围前后差 2×2.9（DXF 实测）
hem_adjust          = 2.9     # 脚口前后差同上

# 直裆深：DXF 立裆净 267.4×0.92 + 腰头 4 ≈ 28.6 = 95.3×0.25 + 4.9
# （此款臀围贴合、裆深相对长，纯比例 0.25 不够，须加修正量）
rise_ratio          = 0.25
rise_adjust         = 4.9

# 腰围拆分：前片合计 171.5 净（腰弧 67.9 + 袋口段 103.6）/ 后机头上口 209.6
#   → 前减后加 = (209.6−171.5)/2×0.85 = 1.62
waist_balance       = 1.9    # 前片 = W/4 − 1.6；后片 = W/4 + 1.6
# 后中内收：DXF 腰CB->臀CB 斜率 净 86.2/217.0 = 0.397，成衣口径 ×0.85/×0.92
#   = 0.367 → X = 0.367×15 ≈ 5.5（默认 2.5 斜率仅 0.167，差 2.2 倍；此款
#   后中陡、后包前。注意 webschema 拖拽把手范围 1.5~4.5，5.5 仅 TOML/CLI 可设）
back_intake         = 4.3
front_waist_dart    = 0.0
back_waist_dart     = 0.0

# ---- 后机头/育克（DXF 机头净样：上口 209.6 / 下口 238.9，下口直线）----
back_yoke              = true
back_yoke_cb_dist      = 5.8     # CB 深 62.8×0.92
back_yoke_side_dist    = 3.3     # 侧深 35.7×0.92
back_yoke_mid_anchors  = []      # 下口直线（净样仅 2 折点）
back_yoke_edges        = []

# ---- 后外缝髋腰弧（DXF 弦法向剖面拟合：工厂低段平、高段满，s0.4~0.8
#      维持外凸 ~2.4mm；引擎默认上半段塌陷、贴腰处内凹 -1.3mm。
#      dx1 压平低段（引擎低段本就偏鼓）、dx2 撑起上段饱满度）----
back_hipwaist_arc_dx1  = 0.0     # 臀侧凸量（默认 0.15）
back_hipwaist_arc_k1   = 0.35    # 凸感延续高度（默认 0.40）
back_hipwaist_arc_dx2  = 0.5     # 腰头角点外撑（默认 0.0；超推导文档建议
                                 #   0~0.3，上段饱满度拟合需要）
back_hipwaist_arc_k2   = 0.20    # 越晚收进腰头越满（默认 0.25）

# ---- 前口袋（DXF 缝位拟合实测：袋口弧 162.6、B'->P1 腰段 103.6、B'->P2 沿外缝 74.7）----
front_pocket            = true
front_pocket_p1_dist    = 8.8     # 袋贴顶边越过 P1 后的净段 103.6×0.85（非全长 128.9）
front_pocket_p2_drop    = 6.9     # B'->P2 沿外缝 74.7×0.92（袋贴右边全长 127 = 74.7 + 52.0）
front_pocket_dart_width = 0.0
front_pocket_mouth_mode = "bulge" # 净样 33 折点光滑单曲弧
front_pocket_mouth_bulge = 1.6    # 弧长 162.6/弦 139 比值 1.15 折算（版上弦距略宽，压低取 1.6）
front_pocket_mouth_bulge_at = 0.5

# ---- 袋贴（DXF「前代」块=袋贴；工厂「袋」GBK B4FC 误录「代」B4FA。
#      构造（袋口弧缝位对位拟合，RMS 0.02mm）：顶边全长 128.9 = P1->B' 103.6
#      + 越过 P1 搭在面板腰口上的重叠 25.3（落点恰在面板腰弧 A->P1 上，锁袋口顶）；
#      右边全长 127 = B'->P2 74.7（补外缝）+ P2 以下 52.0（随袋身进外缝）；
#      内边 246.7 = 袋口弧 162.6 + 下延，即贴+袋身一体件。袋布走口袋布里料、
#      不进工厂打版 DXF，故 front_pouch 不开）----
front_pocket_facing         = true
front_pocket_facing_width   = 2.15    # 越过 P1 的腰口搭量 25.3×0.85（贴到门襟侧越贴）
front_pocket_facing_side_w  = 4.8     # P2 以下沿外缝 52.0×0.92（侧边自 B' 共 11.7）
front_pocket_facing_mode    = "tangent"
front_pocket_facing_h1      = 5.0     # 内弧长目标 246.7×0.85/10 ≈ 21.0
front_pocket_facing_h2      = 4.0

# ---- 小表袋（DXF 净样 80×50：口宽 80、直边高 35、盾尖再下 15）----
watch_pocket                  = true
watch_pocket_mode             = "custom"
watch_pocket_width            = 6.8     # 80×0.85
watch_pocket_rotate_deg       = 0.0
watch_pocket_points           = [[0.0, 0.0], [6.8, 0.0], [6.8, 3.2], [3.4, 4.6], [0.0, 3.2]]
watch_pocket_edges            = [["line"], ["line"], ["line"], ["line"], ["line"]]

# ---- 裤耳（DXF 净裁连条 457.2×25.4 无缩水：8.5×5 根 + 损耗 3.2）----
belt_loop              = true
belt_loop_width        = 2.5     # 25.4mm = 1 英寸净宽
belt_loop_unit_length  = 8.5
belt_loop_count        = 5
belt_loop_waste        = 3.2     # 总长 45.7 ✓ 对上 457.2

# ---- 后贴袋（DXF 净样 156×156.7：口 156、底 132.2、尖下 28.9）----
back_patch                  = true
back_patch_width            = 13.3    # 156×0.85
back_patch_height           = 14.4    # 156.7×0.92
back_patch_shape            = "baker_shield"
back_patch_bottom_width     = 11.2    # 132.2×0.85
back_patch_tip_depth        = 2.7     # 28.9×0.92
# 贴袋定位（inset_x/drop_y）DXF 独立排版读不到，用默认

# ---- 门襟（DXF 单排 177.8×41.3 + 双排 177.8×82.5 均为矩形净样）----
fly                  = false     # 工厂走独立门襟裁片（单排+双排）
fly_separate         = true
fly_width            = 3.5       # 41.3×0.85
fly_length_ratio     = 0.48      # 开深 L ≈ 16.4 = 177.8×0.92
fly_length_base      = 2.0
fly_sep_extra        = 0.0     # DXF 裁片高即 L=16.4，无底部延展
fly_sep_double       = true

# ---- 腰头（DXF 整条弯腰头净样：上口 713.9 / 下口 756.9 / 宽 45.9）----
waistband_type       = "curved"
waistband_width      = 4.0       # 45.9 还原 3.9~4.2
front_waist_curve_sag = 0.4 
back_waist_curve_sag  = 0.4
waistband_full_piece = true      # 整条（后中对折）
waistband_grain      = "width"   # 长向走纬（横裁）：下口 756.9×0.85 = 643.4 ≈ 腰缝
                                 #   647.9（−4.5 吃势）。若直裁 8% 成品 696.4 会比腰缝
                                 #   长出 4.85cm——净样 756.9 本就比腰缝净 762.2 短 5.3
                                 #   （无叠门余量），4.8cm 无处去，故必是长向 15%
# 腰头专用缩水：直 8%（用户口径：腰头缩水小于大身横 15%）
waistband_shrinkage_warp = 0.08
waistband_shrinkage_weft = 0.15

fit                 = "loose"
size_label          = "S"
show_labels         = false
piece_gap           = 10.0

# ---- 全局缩水（净样 = 成品 ÷ (1−率)，与工厂"测量值×0.85/×0.92"口径一致）----
shrinkage_enabled    = true
shrinkage_warp       = 0.08      # 直（沿裤长 Y）
shrinkage_weft       = 0.15      # 横（沿围度 X）

# 袋布不开（里料口袋布，工厂不进打版 DXF）；小表袋里料不缩水
watch_pocket_shrinkage_warp = 0.0
watch_pocket_shrinkage_weft = 0.0

# ---- 缝份：工厂 ½" = 1.27 ≈ 1.3；脚口卷边毛差 32.2 ≈ 3.2 双折 ----
[options.waistband_seam_allowances]
top = 1.3
bottom = 1.3
left_end = 4.0
right_end = 4.0

[options.back_yoke_seam_allowances]
top = 1.3
bottom = 1.3
cb = 1.3
side = 1.3

[options.front_pocket_facing_seam_allowances]
waist = 1.3
inner = 0.0
side = 1.3

[options.front_pouch_seam_allowances]
fold = 0.0
mouth = 1.3
waist = 1.3
side = 1.3
bottom = 1.3

[options.fly_seam_allowances]
top = 1.3
outer = 1.3
bottom = 1.3
inner = 1.3

[options.watch_pocket_seam_allowances]
top = 2.5
side = 1.3
bottom = 1.3

[options.front_piece_seam_allowances]
waist = 1.3
rise = 1.3
inseam = 1.3
side = 1.3
hem = 3.2          # 毛差 32.2mm 双折卷边
mouth = 1.3
fly_top = 1.3
fly_outer = 1.3
fly_bottom = 1.3

[options.back_piece_seam_allowances]
top = 1.3
waist = 1.3
cb = 1.3
inseam = 1.3
side = 1.3
hem = 3.2

watch_pocket_mode = "facing_intersect"    # 来源：默认 conf 0.40 | 引擎默认
front_intake_ratio = 0.518    # 来源：查表 conf 0.60 | K2 前中内收预测.md：基准 mid_high 带中值 2.0、体态平腹 +0.5、高弹 −0.5、紧身 +0.2，clamp 3.5 → 2.20；ratio = 2.20÷((H−W)/4) = 0.518
back_intake = 2.7    # 来源：查表 conf 0.60 | K3 后中内收预测.md：臀腰差 17 插值 X=3.20、有弹降半档 −0.5 → 15:2.70
delta = 0.4    # 来源：查表 conf 0.60 | DELTA_PRESETS[high_stretch]=0.4（高弹力紧身女牛仔裤（0.3~0.5）；前后片臀围推导.md §四）

back_patch = true    # 来源：预判 conf 0.50 | 惯例先验（未见照片/描述反例）
back_yoke = true    # 来源：预判 conf 0.50 | 惯例先验（未见照片/描述反例）
belt_loop = true    # 来源：预判 conf 0.50 | 惯例先验（未见照片/描述反例）
fly = true    # 来源：预判 conf 0.50 | 惯例先验（未见照片/描述反例）
fly_separate = true    # 来源：预判 conf 0.50 | 惯例先验（未见照片/描述反例）
front_patch = false    # 来源：预判 conf 0.50 | 惯例先验（未见照片/描述反例）
back_dart = false    # 来源：预判 conf 0.50 | 惯例先验（未见照片/描述反例）

# 金标真值 truth.toml（一期示例 case：中高腰弹力小脚女款）
# 由 2026-09-02 管线快照生成，框架键经手工核对：
# H-W=17 straight / 弹 high / skinny；K2 mid_high 基准2.0+直体0.5-弹0.5+skinny0.2=2.2 ratio=2.2/4.25；
# K3 d=17 插值3.2-弹0.5=2.7；delta 0.4（弹力路由）；rise_adjust 2.25；判据/词典改动后 eval 对比重跑
# 2026-09-02 弧深三档按工厂实测定标（真弧高 浅1.5/标准2.5/深3.5 ÷2 → bulge 0.75/1.25/1.75，
# 旧 0.3/0.4/0.5 渲染弧高偏浅 3~4 倍；出处 test_reverse_gold_5015 bulge=1.68）

[measurements]
waist = 74    # 来源：描述 | 腰围；描述摘录「腰围74」
hip = 91    # 来源：描述 | 臀围；描述摘录「臀围91」
knee = 44    # 来源：描述 | 膝围；描述摘录「膝围44」
hem = 34    # 来源：描述 | 脚口；描述摘录「脚口34」
front_rise = 30    # 来源：描述 | 前浪（含腰头）；描述摘录「前浪30」
back_rise = 38    # 来源：描述 | 后浪（含腰头）；描述摘录「后浪38」
outseam = 102    # 来源：描述 | 裤长；描述摘录「裤长102」
thigh = 58    # 来源：描述 | 大腿围；描述摘录「大腿围58」

